<script id="defaultBundle" type="application/json">{"version": "2.1-reviewed", "title": "POP Catchment Analyzer", "html": "\u003cdiv class=\"app\">\n  \u003caside class=\"panel\">\n    \u003cdiv class=\"brand\">\n      \u003cdiv>\u003ch1>POP Catchment Analyzer\u003c/h1>\u003cdiv class=\"muted\">V2.1 • Road Drive Time + POI Hotspot\u003c/div>\u003c/div>\n      \u003cspan class=\"badge\">LONGDO\u003c/span>\n    \u003c/div>\n\n    \u003cdiv class=\"quick\">\n      \u003cbutton data-go=\"secApi\">API\u003c/button>\u003cbutton data-go=\"secSite\">Site\u003c/button>\u003cbutton data-go=\"secRadius\">Radius\u003c/button>\u003cbutton data-go=\"secDrive\">Drive\u003c/button>\u003cbutton data-go=\"secPoi\">POI\u003c/button>\u003cbutton data-go=\"secPop\">POP\u003c/button>\n    \u003c/div>\n\n    \u003csection id=\"secApi\" class=\"section\">\n      \u003ch2>1) Longdo API\u003c/h2>\n      \u003cinput id=\"apiKey\" type=\"password\" placeholder=\"Longdo API Key\" autocomplete=\"off\">\n      \u003cdiv class=\"row\">\u003cbutton id=\"connectBtn\" class=\"primary\">เชื่อม Longdo\u003c/button>\u003clabel class=\"check\">\u003cinput id=\"rememberKey\" type=\"checkbox\" checked>จำ Key เครื่องนี้\u003c/label>\u003c/div>\n      \u003cdiv id=\"apiStatus\" class=\"status\">ยังไม่ได้เชื่อม\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"secSite\" class=\"section\">\n      \u003ch2>2) Site\u003c/h2>\n      \u003cinput id=\"siteSearch\" placeholder=\"ค้นหาสถานที่\">\n      \u003cdiv class=\"row\">\u003cbutton id=\"searchBtn\">ค้นหา\u003c/button>\u003cbutton id=\"centerSiteBtn\" class=\"good\">ใช้จุดกลางแผนที่\u003c/button>\u003c/div>\n      \u003cdiv id=\"searchResults\" class=\"searchResults\">\u003c/div>\n      \u003cinput id=\"siteName\" value=\"My Site\" style=\"margin-top:6px\">\n      \u003cdetails>\n        \u003csummary>Lat / Lon\u003c/summary>\n        \u003cdiv class=\"two\" style=\"margin-top:6px\">\u003cinput id=\"lat\" type=\"number\" step=\".000001\" value=\"13.756300\">\u003cinput id=\"lon\" type=\"number\" step=\".000001\" value=\"100.501800\">\u003c/div>\n        \u003cdiv class=\"row\">\u003cbutton id=\"setSiteBtn\">ใช้ Lat/Lon\u003c/button>\u003cbutton id=\"goSiteBtn\">กลับ Site\u003c/button>\u003c/div>\n      \u003c/details>\n      \u003cdiv id=\"siteStatus\" class=\"status\">ยังไม่ได้ตั้ง Site\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"secRadius\" class=\"section\">\n      \u003ch2>3) Radius\u003c/h2>\n      \u003cdiv id=\"radiusChecks\" class=\"checkGrid\">\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-r=\"1\">\u003cspan class=\"dot\" style=\"background:#64748b\">\u003c/span>1 km\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-r=\"3\">\u003cspan class=\"dot\" style=\"background:#0f766e\">\u003c/span>3 km\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-r=\"5\" checked>\u003cspan class=\"dot\" style=\"background:#ca8a04\">\u003c/span>5 km\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-r=\"10\">\u003cspan class=\"dot\" style=\"background:#ea580c\">\u003c/span>10 km\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-r=\"15\">\u003cspan class=\"dot\" style=\"background:#b91c1c\">\u003c/span>15 km\u003c/label>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"secDrive\" class=\"section\">\n      \u003ch2>4) Drive Time — Road Network → Site\u003c/h2>\n      \u003cdiv class=\"small\">ทุก sample point คำนวณ Longdo Route Matrix ตามถนนจริงเข้าหา Site • สีบนแผนที่เป็น sampled raster ไม่ใช่เส้นทางบิน\u003c/div>\n      \u003cdiv id=\"driveChecks\" class=\"checkGrid\" style=\"margin-top:6px\">\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-d=\"5\">\u003cspan class=\"dot\" style=\"background:#22c55e\">\u003c/span>5 min\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-d=\"10\" checked>\u003cspan class=\"dot\" style=\"background:#06b6d4\">\u003c/span>10 min\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-d=\"15\">\u003cspan class=\"dot\" style=\"background:#3b82f6\">\u003c/span>15 min\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-d=\"20\">\u003cspan class=\"dot\" style=\"background:#a855f7\">\u003c/span>20 min\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-d=\"30\">\u003cspan class=\"dot\" style=\"background:#ef4444\">\u003c/span>30 min\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003clabel class=\"check\">\u003cinput id=\"trafficChk\" type=\"checkbox\" checked>Traffic ตอนนี้\u003c/label>\n        \u003cbutton id=\"calcDriveBtn\" class=\"good\">คำนวณ Drive Time\u003c/button>\n      \u003c/div>\n      \u003cdiv class=\"legend\">\n        \u003cspan>\u003ci class=\"sw\" style=\"background:#22c55e\">\u003c/i>≤5\u003c/span>\n        \u003cspan>\u003ci class=\"sw\" style=\"background:#06b6d4\">\u003c/i>≤10\u003c/span>\n        \u003cspan>\u003ci class=\"sw\" style=\"background:#3b82f6\">\u003c/i>≤15\u003c/span>\n        \u003cspan>\u003ci class=\"sw\" style=\"background:#a855f7\">\u003c/i>≤20\u003c/span>\n        \u003cspan>\u003ci class=\"sw\" style=\"background:#ef4444\">\u003c/i>≤30\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"progress\">\u003ci id=\"driveProgress\">\u003c/i>\u003c/div>\n      \u003cdiv id=\"driveStatus\" class=\"status\">ยังไม่ได้คำนวณ\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton id=\"checkCenterBtn\">ตรวจจุดกลางแผนที่ → Site\u003c/button>\u003cbutton id=\"clearRouteBtn\">ล้าง Route\u003c/button>\u003c/div>\n      \u003cdiv id=\"routeCheckStatus\" class=\"status\">ย้ายแผนที่ให้กากบาทอยู่บนจุดที่ต้องการตรวจ\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"secPoi\" class=\"section\">\n      \u003ch2>5) POI + Hotspot\u003c/h2>\n      \u003cdiv class=\"small\">POI รอบ Site 15 km • Hotspot = จำนวน POI ต่อช่อง 1 km ไม่มี weighting\u003c/div>\n      \u003cdiv id=\"poiChecks\" class=\"poiGrid\" style=\"margin-top:6px\">\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-poi=\"village\">หมู่บ้าน \u003cspan id=\"cnt-village\" class=\"poiCount\">0\u003c/span>\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-poi=\"condo\">คอนโด \u003cspan id=\"cnt-condo\" class=\"poiCount\">0\u003c/span>\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-poi=\"school\">โรงเรียน \u003cspan id=\"cnt-school\" class=\"poiCount\">0\u003c/span>\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-poi=\"hospital\">โรงพยาบาล \u003cspan id=\"cnt-hospital\" class=\"poiCount\">0\u003c/span>\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-poi=\"mall\">ห้าง \u003cspan id=\"cnt-mall\" class=\"poiCount\">0\u003c/span>\u003c/label>\n        \u003clabel class=\"check\">\u003cinput type=\"checkbox\" data-poi=\"market\">ตลาด \u003cspan id=\"cnt-market\" class=\"poiCount\">0\u003c/span>\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"row\">\n        \u003clabel class=\"check\">\u003cinput id=\"hotspotChk\" type=\"checkbox\">Hotspot\u003c/label>\n        \u003cbutton id=\"refreshPoiBtn\">โหลดใหม่\u003c/button>\u003cbutton id=\"clearPoiBtn\">ซ่อนทั้งหมด\u003c/button>\n      \u003c/div>\n      \u003cdiv id=\"poiStatus\" class=\"status\">ยังไม่ได้เลือก POI\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"secPop\" class=\"section\">\n      \u003ch2>6) POP จาก Tablet\u003c/h2>\n      \u003cdiv class=\"small\">รับ XLS / XLSX / CSV / JSON • ต้องมี lat, lon, pop; house เป็น optional\u003c/div>\n      \u003cdiv class=\"row\">\u003cbutton id=\"importPopBtn\">เลือกไฟล์ POP\u003c/button>\u003cbutton id=\"clearPopBtn\">ล้าง POP\u003c/button>\u003c/div>\n      \u003cinput id=\"popFile\" class=\"hidden\" type=\"file\" accept=\".xls,.xlsx,.csv,.json,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,application/json\">\n      \u003cdiv id=\"popStatus\" class=\"status\">ยังไม่มีข้อมูล POP\u003c/div>\n      \u003ctable style=\"margin-top:6px\">\n        \u003ctbody>\n          \u003ctr>\u003ctd>Source\u003c/td>\u003ctd id=\"srcVal\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Points\u003c/td>\u003ctd id=\"ptsVal\">0\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Total POP\u003c/td>\u003ctd id=\"popVal\">—\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>Total บ้าน\u003c/td>\u003ctd id=\"houseVal\">—\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection class=\"section\">\n      \u003ch2>7) Catchment Summary\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Catchment\u003c/th>\u003cth>POP\u003c/th>\u003cth>บ้าน\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody id=\"summaryBody\">\u003ctr>\u003ctd colspan=\"3\" style=\"text-align:center;color:#94a3b8\">ยังไม่มี POP\u003c/td>\u003c/tr>\u003c/tbody>\n      \u003c/table>\n      \u003cdiv class=\"small\" style=\"margin-top:5px\">Radius = exact geometry • Drive Time POP = estimate from nearest routed sample cell\u003c/div>\n    \u003c/section>\n  \u003c/aside>\n\n  \u003cmain class=\"main\">\n    \u003cdiv class=\"mapTop\">\u003cb id=\"mapSiteName\">My Site\u003c/b>\u003cspan id=\"coordBadge\" class=\"badge\">13.756300, 100.501800\u003c/span>\u003cspan id=\"mapState\" class=\"badge\">NOT CONNECTED\u003c/span>\u003c/div>\n    \u003cdiv class=\"mapWrap\">\n      \u003cdiv id=\"map\">\u003c/div>\n      \u003cdiv class=\"crosshair\">\u003c/div>\n      \u003cdiv class=\"mapCtl\">\u003cbutton id=\"zoomIn\">+\u003c/button>\u003cbutton id=\"zoomOut\">−\u003c/button>\u003cbutton id=\"siteBtn\" style=\"font-size:11px\">SITE\u003c/button>\u003c/div>\n      \u003cdiv id=\"mapInfo\" class=\"mapInfo\">ใส่ Longdo API Key แล้วกดเชื่อม\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"footer\">Drive Time = sampled Route Matrix • direction = sample point → Site • exact route check available\u003c/div>\n  \u003c/main>\n\u003c/div>", "css": "\n:root{\n --bg:#0f172a;--panel:#111827;--card:#0b1220;--line:#334155;--text:#f8fafc;\n --muted:#94a3b8;--blue:#38bdf8;--green:#10b981;--red:#fb7185;--yellow:#f59e0b\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,\"Segoe UI\",\"Noto Sans Thai\",sans-serif}\nbutton,input,select{font:inherit}\nbutton{min-height:40px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:#fff;padding:7px 10px;font-weight:650}\nbutton.primary{background:#075985;border-color:#0ea5e9}\nbutton.good{background:#065f46;border-color:#10b981}\nbutton.warn{background:#7c2d12;border-color:#fb923c}\nbutton:disabled{opacity:.45}\ninput,select{width:100%;min-height:40px;border:1px solid #475569;border-radius:8px;background:#0b1220;color:#fff;padding:7px 9px}\n.app{position:fixed;inset:0}\n.panel{position:absolute;left:0;top:0;bottom:0;width:380px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:12px 12px 36px}\n.main{position:absolute;left:380px;right:0;top:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}\n.mapTop{flex:none;min-height:48px;padding:8px 10px;background:#0b1220;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.mapWrap{position:relative;flex:1;min-height:0;background:#dbe4e1}\n#map{position:absolute;inset:0}\n.mapCtl{position:absolute;right:10px;top:10px;z-index:20;display:flex;flex-direction:column;gap:5px}\n.mapCtl button{width:48px;height:48px;padding:0;background:rgba(15,23,42,.93)}\n.mapInfo{position:absolute;left:10px;bottom:10px;z-index:20;background:rgba(15,23,42,.95);border:1px solid #475569;border-radius:8px;padding:7px 9px;font-size:11px;max-width:75%;line-height:1.35}\n.crosshair{position:absolute;left:50%;top:50%;z-index:18;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;opacity:.75}\n.crosshair:before,.crosshair:after{content:\"\";position:absolute;background:#0f172a;box-shadow:0 0 1px #fff}\n.crosshair:before{left:11px;top:0;width:2px;height:24px}\n.crosshair:after{left:0;top:11px;width:24px;height:2px}\n.footer{flex:none;font-size:10px;color:#94a3b8;padding:5px 9px;background:#0b1220;border-top:1px solid var(--line)}\nh1{font-size:18px;margin:0}.muted,.small{font-size:11px;color:var(--muted);line-height:1.45}\n.brand{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}\n.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#27364a}\n.status{margin-top:7px;padding:7px 8px;border:1px solid #475569;border-radius:8px;background:#0b1220;font-size:11px;line-height:1.45}\n.status.ok{border-color:#166534;color:#bbf7d0}.status.bad{border-color:#9f1239;color:#fecdd3}.status.warn{border-color:#92400e;color:#fde68a}\n.section{border-top:1px solid var(--line);margin-top:11px;padding-top:10px}.section h2{font-size:13px;margin:0 0 7px}\n.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.row>*{min-width:0}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n.checkGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}\n.poiGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}\n.check{display:flex;align-items:center;gap:4px;background:#0b1220;border:1px solid #2d3a50;border-radius:7px;padding:6px;font-size:11px}\n.check input{width:17px;height:17px;min-height:17px;padding:0}\n.dot{width:8px;height:8px;border-radius:50%}\n.quick{position:sticky;top:0;z-index:40;background:var(--panel);display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:6px 0}\n.quick button{font-size:10px;min-height:32px;padding:4px 2px}\ndetails{margin-top:6px;background:#0b1220;border:1px solid #2d3a50;border-radius:7px;padding:6px 8px}\nsummary{cursor:pointer;font-size:11px;color:#cbd5e1;font-weight:600}\ntable{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:5px 3px;border-bottom:1px solid #29364a;text-align:right}th:first-child,td:first-child{text-align:left}\n.searchResults{max-height:130px;overflow:auto}.searchResults button{width:100%;text-align:left;margin-top:3px;font-size:10px;line-height:1.3}\n.poiCount{margin-left:auto;color:#94a3b8;font-size:10px}\n.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:10px;color:#cbd5e1}\n.legend span{display:flex;align-items:center;gap:4px}\n.sw{width:10px;height:10px;border-radius:2px}\n.progress{height:6px;background:#1e293b;border-radius:999px;overflow:hidden;margin-top:6px}\n.progress>i{display:block;height:100%;width:0;background:#38bdf8}\n.hidden{display:none!important}\n@media(max-width:760px){.panel{width:330px}.main{left:330px}}\n", "js": "\n(()=>{\"use strict\";\nconst $=id=>document.getElementById(id), qsa=s=>Array.from(document.querySelectorAll(s));\nconst RC={1:\"#64748b\",3:\"#0f766e\",5:\"#ca8a04\",10:\"#ea580c\",15:\"#b91c1c\"};\nconst DC={5:\"#22c55e\",10:\"#06b6d4\",15:\"#3b82f6\",20:\"#a855f7\",30:\"#ef4444\"};\nconst DRIVE_RADIUS={5:8,10:15,15:22,20:30,30:40};\nconst DRIVE_STEP={5:1.0,10:1.5,15:2.0,20:2.5,30:3.2};\nconst POI_CFG={\n  village:{label:\"หมู่บ้าน\",tag:\"หมู่บ้าน\",keyword:\"หมู่บ้าน\"},\n  condo:{label:\"คอนโด\",tag:\"คอนโดมิเนียม\",keyword:\"คอนโดมิเนียม\"},\n  school:{label:\"โรงเรียน\",tag:\"โรงเรียน\",keyword:\"โรงเรียน\"},\n  hospital:{label:\"โรงพยาบาล\",tag:\"โรงพยาบาล\",keyword:\"โรงพยาบาล\"},\n  mall:{label:\"ห้าง\",tag:\"ห้างสรรพสินค้า\",keyword:\"ห้างสรรพสินค้า\"},\n  market:{label:\"ตลาด\",tag:\"ตลาด\",keyword:\"ตลาด\"}\n};\n\nconst S={\n  map:null,key:\"\",connected:false,\n  site:{name:\"My Site\",lat:13.7563,lon:100.5018},\n  marker:null,radius:[],\n  driveOverlays:[],driveSamples:[],driveStepKm:null,driveMode:\"t\",driveMax:0,\n  routeOverlay:[],\n  poi:{},poiData:{},hotspotOverlays:[],\n  pop:[],popSource:\"\"\n};\n\nfunction status(id,msg,kind=\"\"){const e=$(id);e.textContent=msg;e.className=\"status\"+(kind?\" \"+kind:\"\")}\nfunction info(msg){$(\"mapInfo\").textContent=msg}\nfunction fmt(n){return Math.round(Number(n)||0).toLocaleString(\"th-TH\")}\nfunction rgba(hex,a){const h=hex.slice(1);return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`}\nfunction clearOverlays(arr){if(!S.map)return;while(arr.length){const o=arr.pop();try{S.map.Overlays.remove(o)}catch(e){}}}\nfunction qs(params){\n  const u=new URLSearchParams();\n  for(const [k,v] of Object.entries(params||{})){\n    if(v==null)continue;\n    if(Array.isArray(v)){\n      v.forEach((x,i)=>u.append(`${k}[${i}]`,String(x)));\n    }else u.append(k,String(v));\n  }\n  return u.toString();\n}\nfunction jsonp(url,params,timeout=25000){\n  return new Promise((resolve,reject)=>{\n    const cb=\"__ld\"+Date.now()+Math.random().toString(36).slice(2),sc=document.createElement(\"script\");\n    let done=false;\n    const t=setTimeout(()=>end(new Error(\"timeout\")),timeout);\n    function end(err,d){if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(e){}sc.remove();err?reject(err):resolve(d)}\n    window[cb]=d=>end(null,d);\n    sc.src=url+\"?\"+qs({...params,callback:cb});\n    sc.onerror=()=>end(new Error(\"network error\"));\n    document.head.appendChild(sc);\n  });\n}\nfunction hav(a,b){\n  const R=6371,dp=(b.lat-a.lat)*Math.PI/180,dl=(b.lon-a.lon)*Math.PI/180,p1=a.lat*Math.PI/180,p2=b.lat*Math.PI/180;\n  const h=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;\n  return 2*R*Math.asin(Math.sqrt(h));\n}\nfunction kmToLat(km){return km/110.574}\nfunction kmToLon(km,lat){return km/(111.320*Math.max(.2,Math.cos(lat*Math.PI/180)))}\n\nasync function connect(){\n  const k=$(\"apiKey\").value.trim();\n  if(!k){status(\"apiStatus\",\"กรุณาใส่ Key\",\"bad\" freshCheckedPoi();\n}\nfunction circle(lat,lon,km,steps=100){\n  const out=[],R=6371,p1=lat*Math.PI/180,l1=lon*Math.PI/180,d=km/R;\n  for(let i=0;i\u003csteps;i++){\n    const b=2*Math.PI*i/steps;\n    const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));\n    const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));\n    out.push({lat:p2*180/Math.PI,lon:l2*180/Math.PI})\n  }\n  return out\n}\nfunction drawRadius(){\n  if(!S.map)return;clearOverlays(S.radius);\n  qsa(\"#radiusChecks input:checked\").forEach(x=>{\n    const r=+x.dataset.r,c=RC[r],pg=new longdo.Polygon(circle(S.site.lat,S.site.lon,r),{\n      lineColor:c,lineWidth:1,lineStyle:longdo.LineStyle.Dashed,fillColor:rgba(c,.025)\n    });\n    S.map.Overlays.add(pg);S.radius.push(pg)\n  })\n}\n\nasync function search(){\n  if(!S.connected){status(\"siteStatus\",\"เชื่อม Longdo ก่อน\",\"bad\");return}\n  const kw=$(\"siteSearch\").value.trim();if(!kw)return;\n  $(\"searchResults\").innerHTML='\u003cdiv class=\"small\">กำลังค้นหา…\u003c/div>';\n  try{\n    const d=await jsonp(\"https://search.longdo.com/mapsearch/json/search\",{keyword:kw,lon:S.site.lon,lat:S.site.lat,limit:6,locale:\"th\",key:S.key});\n    const a=d&&Array.isArray(d.data)?d.data:[];\n    $(\"searchResults\").innerHTML=\"\";\n    for(const x of a){\n      const b=document.createElement(\"button\");\n      b.textContent=`${x.name||\"\"} — ${x.address||\"\"}`;\n      b.onclick=()=>setSite(+x.lat,+x.lon,x.name||kw,true);\n      $(\"searchResults\").appendChild(b)\n    }\n    if(!a.length)$(\"searchResults\").innerHTML='\u003cdiv class=\"small\">ไม่พบผลลัพธ์\u003c/div>'\n  }catch(e){$(\"searchResults\").innerHTML='\u003cdiv class=\"small\">ค้นหาไม่สำเร็จ\u003c/div>'}\n}\n\n/* DRIVE TIME: actual matrix point -> Site */\nfunction selectedDriveMinutes(){return qsa(\"#driveChecks input:checked\").map(x=>+x.dataset.d).sort((a,b)=>a-b)}\nfunction clearDrive(){\n  clearOverlays(S.driveOverlays);\n  S.driveSamples=[];S.driveStepKm=null;S.driveMax=0;\n  $(\"driveProgress\").style.width=\"0%\";\n}\nfunction generateGrid(maxMin){\n  const radius=DRIVE_RADIUS[maxMin],step=DRIVE_STEP[maxMin];\n  const pts=[];\n  for(let y=-radius;y\u003c=radius+1e-9;y+=step){\n    for(let x=-radius;x\u003c=radius+1e-9;x+=step){\n      if(Math.hypot(x,y)>radius+step*.45)continue;\n      pts.push({\n        lat:S.site.lat+kmToLat(y),\n        lon:S.site.lon+kmToLon(x,S.site.lat),\n        xkm:x,ykm:y\n      });\n    }\n  }\n  return {pts,step,radius}\n}\nasync function matrixBatch(points,mode){\n  const d=await jsonp(\"https://api.longdo.com/RouteService/json/route/matrix\",{\n    flon:points.map(p=>p.lon),\n    flat:points.map(p=>p.lat),\n    tlon:[S.site.lon],\n    tlat:[S.site.lat],\n    mode,\n    type:17,\n    restrict:0,\n    locale:\"th\",\n    key:S.key\n  },30000);\n  if(d&&d.meta&&d.meta.status)throw new Error(d.meta.message||(\"matrix \"+d.meta.status));\n  const data=d&&Array.isArray(d.data)?d.data:[];\n  return points.map((p,i)=>{\n    const row=data[i],r=Array.isArray(row)?row[0]:row;\n    return {...p,interval:r&&Number.isFinite(+r.interval)?+r.interval:null,distance:r&&Number.isFinite(+r.distance)?+r.distance:null}\n  })\n}\nfunction driveBucket(sec,mins){\n  if(!Number.isFinite(sec))return null;\n  const m=sec/60;\n  for(const t of mins)if(m\u003c=t)return t;\n  return null;\n}\nfunction cellPoly(p,step){\n  const h=step*.46;\n  const dlat=kmToLat(h),dlon=kmToLon(h,p.lat);\n  return [\n    {lat:p.lat+dlat,lon:p.lon-dlon},\n    {lat:p.lat+dlat,lon:p.lon+dlon},\n    {lat:p.lat-dlat,lon:p.lon+dlon},\n    {lat:p.lat-dlat,lon:p.lon-dlon}\n  ]\n}\nfunction drawDriveSamples(mins){\n  clearOverlays(S.driveOverlays);\n  for(const p of S.driveSamples){\n    const b=driveBucket(p.interval,mins);if(!b)continue;\n    const c=DC[b];\n    const pg=new longdo.Polygon(cellPoly(p,S.driveStepKm),{\n      lineColor:rgba(c,.26),lineWidth:1,fillColor:rgba(c,.22)\n    });\n    S.map.Overlays.add(pg);S.driveOverlays.push(pg);\n  }\n}\nasync function calcDrive(){\n  if(!S.connected){status(\"driveStatus\",\"เชื่อม Longdo ก่อน\",\"bad\");return}\n  const mins=selectedDriveMinutes();\n  if(!mins.length){status(\"driveStatus\",\"เลือกเวลาอย่างน้อย 1 ค่า\",\"warn\");return}\n  const maxMin=Math.max(...mins),g=generateGrid(maxMin);\n  const mode=$(\"trafficChk\").checked?\"t\":\"c\";\n  S.driveMode=mode;S.driveMax=maxMin;S.driveStepKm=g.step;\n  clearOverlays(S.driveOverlays);S.driveSamples=[];\n  $(\"calcDriveBtn\").disabled=true;\n  $(\"driveProgress\").style.width=\"0%\";\n  const batches=[];\n  for(let i=0;i\u003cg.pts.length;i+=25)batches.push(g.pts.slice(i,i+25));\n  try{\n    for(let i=0;i\u003cbatches.length;i++){\n      status(\"driveStatus\",`Route Matrix ${i+1}/${batches.length} • จุด → Site • ${mode===\"t\"?\"Traffic\":\"Static\"}`);\n      const r=await matrixBatch(batches[i],mode);\n      S.driveSamples.push(...r);\n      $(\"driveProgress\").style.width=Math.round((i+1)/batches.length*100)+\"%\";\n    }\n    drawDriveSamples(mins);\n    const ok=S.driveSamples.filter(x=>Number.isFinite(x.interval)).length;\n    status(\"driveStatus\",`สำเร็จ ${fmt(ok)} จุด • grid ${g.step} km • ${mode===\"t\"?\"Traffic ตอนนี้\":\"Static\"} • เข้า Site`,\"ok\");\n    refreshSummary();\n  }catch(e){\n    status(\"driveStatus\",\"คำนวณไม่สำเร็จ: \"+e.message,\"bad\");\n  }finally{$(\"calcDriveBtn\").disabled=false}\n}\n\nasync function exactRoute(from){\n  const mode=$(\"trafficChk\").checked?\"t\":\"c\";\n  const d=await jsonp(\"https://api.longdo.com/RouteService/json/route/guide\",{\n    flon:from.lon,flat:from.lat,tlon:S.site.lon,tlat:S.site.lat,\n    mode,type:17,restrict:0,locale:\"th\",maxresult:1,key:S.key\n  },30000);\n  if(d&&d.meta&&d.meta.status)throw new Error(d.meta.message||(\"route \"+d.meta.status));\n  const r=d&&Array.isArray(d.data)?d.data[0]:null;\n  if(!r)throw new Error(\"ไม่พบเส้นทาง\");\n  return {...r,mode}\n}\nasync function routePath(id){\n  const d=await jsonp(\"https://api.longdo.com/RouteService/json/route/path\",{id,key:S.key},25000);\n  const x=d&&Array.isArray(d.data)?d.data[0]:null;\n  let pts=x&&Array.isArray(x.data)?x.data:(Array.isArray(x)?x:[]);\n  return pts.map(p=>({lat:+p.lat,lon:+p.lon})).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lon))\n}\nasync function checkCenterRoute(){\n  if(!S.connected){status(\"routeCheckStatus\",\"เชื่อม Longdo ก่อน\",\"bad\");return}\n  const p=S.map.location();\n  $(\"checkCenterBtn\").disabled=true;status(\"routeCheckStatus\",\"กำลังคำนวณ Route จริง…\");\n  clearRoute();\n  try{\n    const r=await exactRoute({lat:+p.lat,lon:+p.lon});\n    const min=r.interval/60,km=r.distance/1000;\n    status(\"routeCheckStatus\",`${min.toFixed(1)} นาที • ${km.toFixed(1)} km • จุดกลาง → Site • ${r.mode===\"t\"?\"Traffic\":\"Static\"}`,\"ok\");\n    if(r.id!=null){\n      const pts=await routePath(r.id);\n      if(pts.length>1){\n        const line=new longdo.Polyline(pts,{lineColor:\"#111827\",lineWidth:5});\n        S.map.Overlays.add(line);S.routeOverlay.push(line);\n      }\n    }\n  }catch(e){status(\"routeCheckStatus\",\"Route ไม่สำเร็จ: \"+e.message,\"bad\")}\n  finally{$(\"checkCenterBtn\").disabled=false}\n}\nfunction clearRoute(){clearOverlays(S.routeOverlay)}\n\n/* POI */\nfunction clearPoiType(type){\n  const a=S.poi[type]||[];clearOverlays(a);S.poi[type]=[];\n  S.poiData[type]=[];\n  const c=$(\"cnt-\"+type);if(c)c.textContent=\"0\";\n}\nfunction clearAllPoi(){\n  Object.keys(POI_CFG).forEach(clearPoiType);\n  clearHotspot();\n}\nasync function fetchPoi(type){\n  const cfg=POI_CFG[type],all=[];let offset=0;\n  for(let page=0;page\u003c2;page++){\n    let d=await jsonp(\"https://api.longdo.com/POIService/json/search\",{\n      lon:S.site.lon,lat:S.site.lat,span:\"15km\",tag:cfg.tag,offset,limit:100,locale:\"th\",key:S.key\n    },25000);\n    let rows=d&&Array.isArray(d.data)?d.data:[];\n    if(!rows.length&&page===0){\n      d=await jsonp(\"https://search.longdo.com/mapsearch/json/search\",{\n        keyword:cfg.keyword,lon:S.site.lon,lat:S.site.lat,span:\"15km\",offset,limit:100,locale:\"th\",key:S.key\n      },25000);\n      rows=d&&Array.isArray(d.data)?d.data:[];\n    }\n    all.push(...rows);\n    if(!(d&&d.meta&&d.meta.hasmore)||rows.length\u003c100)break;\n    offset+=100;\n  }\n  const seen=new Set(),out=[];\n  for(const x of all){\n    const lat=+x.lat,lon=+x.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;\n    const k=(x.id||\"\")+\"|\"+lat.toFixed(6)+\"|\"+lon.toFixed(6);if(seen.has(k))continue;seen.add(k);\n    out.push({...x,lat,lon});\n  }\n  return out;\n}\nfunction addPoiMarkers(type,rows){\n  clearPoiType(type);S.poiData[type]=rows.slice();\n  for(const x of rows){\n    const m=new longdo.Marker({lat:x.lat,lon:x.lon},{title:x.name||POI_CFG[type].label,detail:x.address||\"\"});\n    S.map.Overlays.add(m);S.poi[type].push(m);\n  }\n  $(\"cnt-\"+type).textContent=String(rows.length);\n}\nasync function togglePoi(type,on){\n  if(!on){clearPoiType(type);if($(\"hotspotChk\").checked)drawHotspot();return}\n  if(!S.connected){document.querySelector(`#poiChecks input[data-poi=\"${type}\"]`).checked=false;status(\"poiStatus\",\"เชื่อม Longdo ก่อน\",\"bad\");return}\n  status(\"poiStatus\",`กำลังโหลด ${POI_CFG[type].label}…`);\n  try{\n    const rows=await fetchPoi(type);addPoiMarkers(type,rows);\n    status(\"poiStatus\",`${POI_CFG[type].label}: ${rows.length} จุด`,\"ok\");\n    if($(\"hotspotChk\").checked)drawHotspot();\n  }catch(e){\n    document.querySelector(`#poiChecks input[data-poi=\"${type}\"]`).checked=false;clearPoiType(type);\n    status(\"poiStatus\",`โหลด ${POI_CFG[type].label} ไม่สำเร็จ: ${e.message}`,\"bad\")\n  }\n}\nasync function refreshCheckedPoi(){\n  const c=qsa(\"#poiChecks input:checked\");if(!c.length){status(\"poiStatus\",\"ยังไม่ได้เลือก POI\");clearHotspot();return}\n  for(const cb of c)await togglePoi(cb.dataset.poi,true);\n  if($(\"hotspotChk\").checked)drawHotspot();\n}\nfunction visiblePoiPoints(){\n  const a=[];\n  for(const cb of qsa(\"#poiChecks input:checked\"))a.push(...(S.poiData[cb.dataset.poi]||[]));\n  return a;\n}\nfunction clearHotspot(){clearOverlays(S.hotspotOverlays)}\nfunction drawHotspot(){\n  clearHotspot();\n  if(!$(\"hotspotChk\").checked||!S.map)return;\n  const pts=visiblePoiPoints();\n  if(!pts.length){status(\"poiStatus\",\"Hotspot ต้องมี POI ที่เลือกก่อน\",\"warn\");return}\n  const cellKm=1,latStep=kmToLat(cellKm),lonStep=kmToLon(cellKm,S.site.lat),bins=new Map();\n  for(const p of pts){\n    const iy=Math.floor((p.lat-S.site.lat)/latStep),ix=Math.floor((p.lon-S.site.lon)/lonStep);\n    const k=ix+\",\"+iy;bins.set(k,(bins.get(k)||0)+1);\n  }\n  const max=Math.max(...bins.values());\n  for(const [k,count] of bins){\n    const [ix,iy]=k.split(\",\").map(Number);\n    const lat0=S.site.lat+iy*latStep,lon0=S.site.lon+ix*lonStep;\n    const poly=[\n      {lat:lat0+latStep,lon:lon0},{lat:lat0+latStep,lon:lon0+lonStep},\n      {lat:lat0,lon:lon0+lonStep},{lat:lat0,lon:lon0}\n    ];\n    const alpha=.08+.48*(count/max);\n    const pg=new longdo.Polygon(poly,{lineColor:rgba(\"#dc2626\",.12),lineWidth:1,fillColor:rgba(\"#dc2626\",alpha)});\n    S.map.Overlays.add(pg);S.hotspotOverlays.push(pg);\n  }\n  status(\"poiStatus\",`Hotspot: ${pts.length} POI • ช่อง 1 km • สีเข้ม = จุดมาก`,\"ok\");\n}\n\n/* POP */\nfunction parseCSV(raw){\n  const lines=raw.replace(/^\\uFEFF/,\"\").replace(/\\r/g,\"\").split(\"\\n\").filter(x=>x.trim());\n  if(lines.length\u003c2)throw new Error(\"CSV ไม่มีข้อมูล\");\n  function split(s){let a=[],c=\"\",q=false;for(let i=0;i\u003cs.length;i++){const ch=s[i];if(ch==='\"'){if(q&&s[i+1]==='\"'){c+='\"';i++}else q=!q}else if(ch===\",\"&&!q){a.push(c);c=\"\"}else c+=ch}a.push(c);return a.map(x=>x.trim())}\n  const h=split(lines[0]).map(x=>x.toLowerCase());\n  return lines.slice(1).map(l=>{const c=split(l),o={};h.forEach((k,i)=>o[k]=c[i]);return o})\n}\nfunction normPoint(o){\n  const pick=(...keys)=>{for(const k of keys)if(Object.prototype.hasOwnProperty.call(o,k)&&o[k]!==\"\"&&o[k]!=null)return o[k];return null};\n  const num=v=>{if(v==null||v===\"\")return NaN;return +String(v).replace(/,/g,\"\").trim()};\n  const lat=num(pick(\"lat\",\"latitude\",\"y\",\"ละติจูด\"));\n  const lon=num(pick(\"lon\",\"lng\",\"longitude\",\"long\",\"x\",\"ลองจิจูด\"));\n  const pop=num(pick(\"pop\",\"population\",\"ประชากร\",\"population_total\",\"total_pop\"));\n  const hv=pick(\"house\",\"houses\",\"home\",\"homes\",\"household\",\"households\",\"บ้าน\",\"ครัวเรือน\");\n  const house=hv==null?null:num(hv);\n  return Number.isFinite(lat)&&Number.isFinite(lon)&&Number.isFinite(pop)?{lat,lon,pop,house:Number.isFinite(house)?house:null}:null\n}\nfunction openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(\"popCatchmentDB\",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(\"data\"))r.result.createObjectStore(\"data\")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}\nasync function dbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction(\"data\",\"readwrite\");tx.objectStore(\"data\").put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}\nasync function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(\"data\").objectStore(\"data\").get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}\nasync function dbDel(k){const db=await openDB();return new Promise((res,rej)=>{const r=db.transaction(\"data\",\"readwrite\").objectStore(\"data\").delete(k);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}\nasync function importPop(file){\n  status(\"popStatus\",\"กำลังอ่านไฟล์…\");\n  const lower=file.name.toLowerCase();let rows;\n  if(lower.endsWith(\".xls\")||lower.endsWith(\".xlsx\")){\n    if(typeof XLSX===\"undefined\")throw new Error(\"โหลดตัวอ่าน Excel ไม่สำเร็จ\");\n    const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:\"array\",cellDates:false});\n    if(!wb.SheetNames||!wb.SheetNames.length)throw new Error(\"ไม่พบ Sheet\");\n    rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:\"\",raw:false});\n  }else{\n    const raw=await file.text();\n    if(lower.endsWith(\".json\")){const j=JSON.parse(raw);rows=Array.isArray(j)?j:(j.points||[])}\n    else rows=parseCSV(raw);\n  }\n  if(!Array.isArray(rows)||!rows.length)throw new Error(\"ไม่พบข้อมูลในไฟล์\");\n  rows=rows.map(r=>{const o={};Object.keys(r||{}).forEach(k=>o[String(k).trim().toLowerCase()]=r[k]);return o});\n  const pts=rows.map(normPoint).filter(Boolean);\n  if(!pts.length){\n    const headers=Object.keys(rows[0]||{}).slice(0,24).join(\", \");\n    throw new Error(\"อ่านไฟล์ได้ แต่ไม่พบ lat / lon / pop\"+(headers?(\" • พบหัวคอลัมน์: \"+headers):\"\"));\n  }\n  S.pop=pts;S.popSource=file.name;await dbSet(\"pop\",{source:file.name,points:pts});\n  updatePopUI();refreshSummary();status(\"popStatus\",`พร้อมใช้ ${fmt(pts.length)} จุด • เก็บใน Tablet แล้ว`,\"ok\")\n}\nfunction updatePopUI(){\n  const pop=S.pop.reduce((a,p)=>a+p.pop,0),hs=S.pop.filter(p=>p.house!=null),house=hs.reduce((a,p)=>a+p.house,0);\n  $(\"srcVal\").textContent=S.popSource||\"—\";$(\"ptsVal\").textContent=fmt(S.pop.length);$(\"popVal\").textContent=S.pop.length?fmt(pop):\"—\";$(\"houseVal\").textContent=hs.length?fmt(house):\"—\"\n}\nfunction nearestDriveSample(p){\n  if(!S.driveSamples.length)return null;\n  let best=null,bd=Infinity;\n  for(const s of S.driveSamples){\n    const dx=(p.lon-s.lon)*111.32*Math.cos(p.lat*Math.PI/180),dy=(p.lat-s.lat)*110.574,d=dx*dx+dy*dy;\n    if(d\u003cbd){bd=d;best=s}\n  }\n  return best;\n}\nfunction refreshSummary(){\n  const b=$(\"summaryBody\");\n  if(!S.pop.length){b.innerHTML='\u003ctr>\u003ctd colspan=\"3\" style=\"text-align:center;color:#94a3b8\">ยังไม่มี POP\u003c/td>\u003c/tr>';return}\n  const rows=[];\n  qsa(\"#radiusChecks input:checked\").forEach(x=>{\n    const r=+x.dataset.r;let pop=0,house=0,has=false;\n    for(const p of S.pop)if(hav(S.site,p)\u003c=r){pop+=p.pop;if(p.house!=null){house+=p.house;has=true}}\n    rows.push({label:`Radius ${r} km`,pop,house:has?house:null})\n  });\n  if(S.driveSamples.length){\n    for(const m of selectedDriveMinutes()){\n      let pop=0,house=0,has=false;\n      for(const p of S.pop){\n        const s=nearestDriveSample(p);\n        if(s&&Number.isFinite(s.interval)&&s.interval\u003c=m*60){\n          pop+=p.pop;if(p.house!=null){house+=p.house;has=true}\n        }\n      }\n      rows.push({label:`Drive ~${m} min`,pop,house:has?house:null})\n    }\n  }\n  b.innerHTML=\"\";\n  for(const r of rows)b.insertAdjacentHTML(\"beforeend\",`\u003ctr>\u003ctd>${r.label}\u003c/td>\u003ctd>${fmt(r.pop)}\u003c/td>\u003ctd>${r.house==null?\"—\":fmt(r.house)}\u003c/td>\u003c/tr>`);\n}\n\n/* Events */\n$(\"connectBtn\").onclick=connect;\n$(\"searchBtn\").onclick=search;$(\"siteSearch\").onkeydown=e=>{if(e.key===\"Enter\")search()};\n$(\"setSiteBtn\").onclick=()=>setSite(+$(\"lat\").value,+$(\"lon\").value,$(\"siteName\").value,true);\n$(\"centerSiteBtn\").onclick=()=>{if(S.map){const p=S.map.location();setSite(p.lat,p.lon,$(\"siteName\").value,false)}};\n$(\"goSiteBtn\").onclick=$(\"siteBtn\").onclick=()=>{if(S.map){S.map.location({lat:S.site.lat,lon:S.site.lon});S.map.zoom(12)}};\nqsa(\"#radiusChecks input\").forEach(x=>x.onchange=()=>{drawRadius();refreshSummary()});\n$(\"calcDriveBtn\").onclick=calcDrive;\n$(\"trafficChk\").onchange=()=>{clearDrive();refreshSummary();status(\"driveStatus\",\"เปลี่ยน mode แล้ว กรุณาคำนวณใหม่\",\"warn\")};\n$(\"checkCenterBtn\").onclick=checkCenterRoute;$(\"clearRouteBtn\").onclick=()=>{clearRoute();status(\"routeCheckStatus\",\"ล้าง Route แล้ว\",\"ok\")};\nqsa(\"#poiChecks input\").forEach(cb=>cb.onchange=()=>togglePoi(cb.dataset.poi,cb.checked));\n$(\"refreshPoiBtn\").onclick=refreshCheckedPoi;\n$(\"clearPoiBtn\").onclick=()=>{qsa(\"#poiChecks input\").forEach(cb=>cb.checked=false);$(\"hotspotChk\").checked=false;clearAllPoi();status(\"poiStatus\",\"ซ่อน POI ทั้งหมดแล้ว\",\"ok\")};\n$(\"hotspotChk\").onchange=e=>e.target.checked?drawHotspot():clearHotspot();\n$(\"zoomIn\").onclick=()=>S.map&&S.map.zoom(+S.map.zoom()+1);$(\"zoomOut\").onclick=()=>S.map&&S.map.zoom(+S.map.zoom()-1);\n$(\"importPopBtn\").onclick=()=>$(\"popFile\").click();\n$(\"popFile\").onchange=async e=>{const f=e.target.files&&e.target.files[0];if(f)try{await importPop(f)}catch(err){status(\"popStatus\",\"Import ไม่สำเร็จ: \"+err.message,\"bad\")}e.target.value=\"\"};\n$(\"clearPopBtn\").onclick=async()=>{S.pop=[];S.popSource=\"\";await dbDel(\"pop\");updatePopUI();refreshSummary();status(\"popStatus\",\"ล้างข้อมูล POP แล้ว\",\"ok\")};\nqsa(\".quick button\").forEach(b=>b.onclick=()=>$(b.dataset.go).scrollIntoView({behavior:\"smooth\",block:\"start\"}));\n\n(async function boot(){\n  const k=localStorage.getItem(\"longdoKey\");if(k)$(\"apiKey\").value=k;\n  try{const saved=await dbGet(\"pop\");if(saved&&Array.isArray(saved.points)){S.pop=saved.points;S.popSource=saved.source||\"Local cache\";updatePopUI();refreshSummary();status(\"popStatus\",`โหลด POP จาก Tablet แล้ว ${fmt(S.pop.length)} จุด`,\"ok\")}}catch(e){}\n})();\n})();\n"}</script>
<script>
(()=>{"use strict";
const STORAGE_KEY="popCatchmentAppBundleV1";
const root=document.getElementById("appRoot"),styleEl=document.getElementById("appStyle"),verEl=document.getElementById("appVersion");
const defaultBundle=JSON.parse(document.getElementById("defaultBundle").textContent);
function validBundle(b){return b&&typeof b==="object"&&typeof b.html==="string"&&b.html.length>100&&typeof b.css==="string"&&typeof b.js==="string"&&b.js.length>100}
function loadStored(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return null;const b=JSON.parse(raw);return validBundle(b)?b:null}catch(e){return null}}
function execute(js){const s=document.createElement("script");s.textContent=js+"\n//# sourceURL=pop-catchment-local-update.js";document.body.appendChild(s)}
function render(b,isLocal){document.title=b.title||"POP Catchment Analyzer";styleEl.textContent=b.css||"";root.innerHTML=b.html||"";verEl.textContent=(isLocal?"Local ":"GitHub ")+(b.version||"update");execute(b.js||"")}
function htmlToBundle(text,name){const doc=new DOMParser().parseFromString(text,"text/html");const title=(doc.querySelector("title")?.textContent||"POP Catchment Analyzer").trim();const css=[...doc.querySelectorAll("style")].map(x=>x.textContent).join("\n");const inline=[...doc.querySelectorAll("script:not([src])")].filter(x=>x.id!=="defaultBundle").map(x=>x.textContent).filter(Boolean).join("\n");doc.querySelectorAll("script").forEach(x=>x.remove());const html=(doc.body?.innerHTML||"").trim();const b={version:(name||"local-html").replace(/\.html?$/i,""),title,html,css,js:inline};if(!validBundle(b))throw new Error("ไฟล์ HTML นี้ไม่ใช่ POP Catchment App ที่สมบูรณ์");return b}
async function parseUpdate(file){const text=await file.text();if(file.name.toLowerCase().endsWith(".json")){const b=JSON.parse(text);if(!validBundle(b))throw new Error("Update package ไม่ถูกต้อง");return b}return htmlToBundle(text,file.name)}
const stored=loadStored();render(stored||defaultBundle,!!stored);
document.getElementById("appUpdateBtn").onclick=()=>document.getElementById("appUpdateFile").click();
document.getElementById("appUpdateFile").onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{const b=await parseUpdate(f);localStorage.setItem(STORAGE_KEY,JSON.stringify(b));location.reload()}catch(err){alert("Update ไม่สำเร็จ: "+err.message)}finally{e.target.value=""}};
document.getElementById("appResetBtn").onclick=()=>{if(confirm("กลับไปใช้เวอร์ชันที่อยู่บน GitHub?")){localStorage.removeItem(STORAGE_KEY);location.reload()}};
})();
</script>
